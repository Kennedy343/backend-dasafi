version: '3.8'

services:
  # 1. Servicio de la Base de Datos (PostgreSQL)
  postgres:
    image: postgres:15
    container_name: mi_tienda_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432' # Aún exponemos la BD para poder conectarnos desde afuera
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Servicio de la API (NestJS) - El "Cerebro"
  api:
    build: . # Construye usando tu Dockerfile de NestJS
    container_name: mi_tienda_api
    restart: always
    env_file:
      - .env
    # ¡YA NO HAY 'ports' EXPUESTOS! Nginx se encarga.
    depends_on:
      - postgres
    volumes:
      # Monta la carpeta de subidas para que NestJS (sharp) pueda ESCRIBIR en ella
      # La ruta interna /usr/src/app/uploads debe coincidir con la de tu UploadService
      - ./uploads:/usr/src/app/uploads

  # 3. Servicio de Nginx - El "Recepcionista Rápido"
  nginx:
    image: nginx:1.25-alpine # Usamos una imagen ligera de Nginx
    container_name: mi_tienda_nginx
    restart: always
    ports:
      - "80:80"   # Nginx es el único que escucha en el puerto 80 (HTTP)
      - "443:443" # (Opcional, para HTTPS)
    volumes:
      # Monta tu archivo de configuración personalizado
      - ./nginx.conf:/etc/nginx/nginx.conf
      # Monta la carpeta de subidas para que Nginx pueda LEER de ella
      - ./uploads:/var/www/uploads
    depends_on:
      - api # Nginx no arranca hasta que la API esté lista

volumes:
  pgdata: