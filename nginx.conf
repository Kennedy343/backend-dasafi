# Este es un archivo de configuración básico de Nginx

# Define cuántos hilos de trabajo usar. 'auto' es una buena opción.
worker_processes auto;

# Bloque de eventos (necesario, pero puede estar vacío para empezar)
events {
  worker_connections 1024;
}

# Bloque principal de configuración HTTP
http {

  # Define el tipo de contenido de los archivos (para que el navegador sepa qué es)
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Configuración del servidor (nuestro sitio web)
  server {
    # Escucha en el puerto 80 (HTTP estándar)
    listen 80;

    # --- REGLA 1: RUTAS DE LA API (El Cerebro) ---
    # Para cualquier petición que empiece con /api/
    location /api/ {
      # Reenvíala a nuestro servicio de la API (NestJS)
      # 'api' es el nombre del servicio en docker-compose.yml
      # '3000' es el puerto en el que NestJS corre DENTRO del contenedor
      proxy_pass http://api:3000/;

      # Cabeceras importantes para que NestJS sepa quién es el cliente real
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- REGLA 2: ARCHIVOS ESTÁTICOS (El Recepcionista Rápido) ---
    # Para cualquier petición que empiece con /uploads/
    location /uploads/ {
      # ¡No molestes a la API!
      # Sírvelos directamente desde esta carpeta del disco
      # Esta ruta /var/www/uploads coincide con el 'volume' que definimos en docker-compose
      alias /var/www/uploads/;

      # Opcional: Cachea estas imágenes en el navegador del cliente por 7 días
      expires 7d;
    }

    # (Opcional) Regla para el frontend de React
    # Si añades un frontend, esta regla haría que todo lo demás
    # vaya a tu app de React.
    # location / {
    #   root /usr/share/nginx/html;
    #   try_files $uri /index.html;
    # }
  }
}